global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: observability-service
    metrics_path: /actuator/prometheus
    static_configs:
      targets:
        - host.docker.internal:8080
    relabel_configs:
      - target_label: application
        replacement: observability-service
      - target_label: environment
        replacement: local