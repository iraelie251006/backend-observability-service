spring:
  application:
    name: practice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${ACCESS_EXPIRATION_MS}
      refresh-expiration-ms: ${REFRESH_EXPIRATION_MS}

  rate-limit:
    capacity: 5
    refill-tokens: 5
    refill-seconds: 60
    protected-paths:
      - /api/auth/register
      - /api/auth/login
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cache:
    type: redis

logging:
  config: classpath:logback-spring.xml

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, metrics