spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    jwt:
      secret: dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtMzItYnl0ZXMhIQ==
      expiration-ms: 900000
      refresh-expiration-ms: 604800000

  rate-limit:
    capacity: 5
    refill-tokens: 5
    refill-seconds: 60
    protected-paths:
      - /api/auth/register
      - /api/auth/login