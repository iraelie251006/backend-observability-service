spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop  # create schema on start, drop on finish
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${JWT_SECRET:dqIAICtALsJc8JOpKzkklNMMadpoHOvmBOXMEFKNu0A=}
      expiration-ms: ${ACCESS_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:604800000}

  rate-limit:
    capacity: 5
    refill-tokens: 5
    refill-seconds: 60
    protected-paths:
      - /api/auth/register
      - /api/auth/login